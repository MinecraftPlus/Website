server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/html;
    index index.php;
    autoindex off;
    absolute_redirect off;
    server_tokens off;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Only the front controller can be executed. REQUEST_URI remains unchanged
    # after internal rewrites, so Pico still resolves the original page URL.
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/index.php;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_intercept_errors off;
    }

    # Match these before serving any existing file, including in asset folders.
    # As with the old .htaccess, let Pico render its normal 404 response.
    location ~* ^/(config|content|vendor|language)(/|$) {
        rewrite ^ /index.php last;
    }
    location ~ (^|/)\.(?!well-known(/|$)) {
        rewrite ^ /index.php last;
    }
    location ~* ^/(composer\.(json|lock|phar)|CHANGELOG\.md)(/|$) {
        rewrite ^ /index.php last;
    }
    location ~* \.(php[0-9]*|phtml|phar|twig|ya?ml|md|conf|ini|sh)(/|$) {
        rewrite ^ /index.php last;
    }

    # Bullseye's default MIME table predates the current font media types.
    location ~* \.(woff2?|ttf|otf)$ {
        types {
            font/woff woff;
            font/woff2 woff2;
            font/ttf ttf;
            font/otf otf;
        }
        try_files $uri /index.php$is_args$args;
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }
}
